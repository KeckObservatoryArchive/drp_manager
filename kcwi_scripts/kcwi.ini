[cmd]
cmd_path = start_kcwi_rti # path to the start_kcwi_rti executable
[lev1]
red_cmd =  -r -d DIRECTORY -i KR*.fits -c DRP_CONFIG --rti-cfg RTI_CONFIG --rti-ingesttype lev1 -wWm
blue_cmd = -b -d DIRECTORY -i KB*.fits -c DRP_CONFIG --rti-cfg RTI_CONFIG --rti-ingesttype lev1 -wWm
[lev2]
red_cmd = -r -d DIRECTORY -i KR*.fits -c DRP_CONFIG --rti-cfg RTI_CONFIG --rti-ingesttype lev2 -g
blue_cmd = -b -d DIRECTORY -i KB*.fits -c DRP_CONFIG --rti-cfg RTI_CONFIG --rti-ingesttype lev2 -g
[rti]
url = http://localhost:5000 # URL to the RTI server
rti_user = ''
rti_pass = ''
